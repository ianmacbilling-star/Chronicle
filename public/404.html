<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/themes/campaignia.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — This page isn't here</title>
  <link rel="icon" type="image/png" href="/images/Campaignia_Icon.png" />
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Crimson Text', Georgia, serif;
      background: var(--page-bg);
      background-image: url('/images/Campaignia_background.png');
      background-size: cover;
      background-position: center;
      color: var(--accent-pale);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(var(--page-bg-rgb),0.82);
    }
    .panel {
      position: relative;
      z-index: 1;
      border: 4px solid var(--page-bg);
      background: rgba(var(--panel-rgb),0.95);
      max-width: 560px;
      width: 100%;
      text-align: center;
      overflow: hidden;
    }
    .panel-top {
      background: var(--panel);
      border-bottom: 3px solid rgba(var(--accent-rgb),0.2);
      padding: 24px;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 4px;
    }
    .logo img { height: 30px; width: auto; margin: 0 auto; }
    .panel-body {
      padding: 48px 40px;
    }
    .error-num {
      font-family: 'Bangers', cursive;
      font-size: 120px;
      color: var(--danger);
      line-height: 1;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }
    .narrator-box {
      background: var(--on-panel);
      color: var(--surface-ink-text);
      border: 3px solid var(--page-bg);
      padding: 16px 20px;
      font-style: italic;
      font-size: 16px;
      line-height: 1.7;
      margin: 24px 0;
      position: relative;
    }
    .narrator-box::before {
      content: 'NARRATOR';
      position: absolute;
      top: -1px;
      left: 12px;
      font-family: 'Bangers', cursive;
      font-size: 10px;
      letter-spacing: 3px;
      background: var(--on-panel);
      padding: 0 6px;
      transform: translateY(-50%);
    }
    .title {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 16px;
      font-style: italic;
      color: rgba(var(--accent-pale-rgb),0.6);
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      font-family: 'Bangers', cursive;
      font-size: 20px;
      letter-spacing: 2px;
      padding: 14px 40px;
      background: var(--accent);
      color: var(--surface-ink-text);
      text-decoration: none;
      border: 3px solid var(--page-bg);
      box-shadow: 4px 4px 0 var(--page-bg);
      transition: all 0.15s;
      margin: 6px;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--page-bg);
    }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border-color: rgba(var(--accent-rgb),0.3);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    }
    .btn-ghost:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-top">
      <div class="logo"><img src="/images/Campaignia_Logo.png" alt="Campaignia" /></div>
    </div>
    <div class="panel-body">
      <div class="error-num">404</div>
      <!-- v3.0.841 -- TD-688. The comic panel stays; the adventuring party does not. This is
           also where a reader lands when a link-only story is removed or made private, so it
           says that rather than making a joke at their expense. -->
      <div class="title">THIS PAGE ISN'T HERE</div>
      <div class="sub">The link may be old, or the story may have been removed.</div>
      <div class="narrator-box">
        Whatever was at this address isn't here now. It may have been removed, made private, or never existed at all.
      </div>
      <a href="/" class="btn">GO TO THE HOME PAGE</a>
      <a href="/app.html" class="btn btn-ghost">OPEN CAMPAIGNIA</a>
    </div>
  </div>
</body>
</html>
