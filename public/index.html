<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span class="auth-logo-name">Chronicle</span>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-panel">
      <div class="auth-title">Welcome back, DM</div>
      <div class="auth-subtitle">Sign in to your campaigns</div>
      <div id="login-error" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="login-password" placeholder="Your password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary w-full btn-lg" id="login-btn">Sign in</button>
      <div class="auth-switch">
        New to Chronicle? <a onclick="showRegister()">Create an account</a>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-panel" class="hidden">
      <div class="auth-title">Create your account</div>
      <div class="auth-subtitle">Start chronicling your campaigns</div>
      <div id="register-error" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label class="form-label">Your name</label>
        <input class="form-input" type="text" id="reg-name" placeholder="e.g. Dungeon Master Dave" autocomplete="name" />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary w-full btn-lg" id="register-btn">Create account</button>
      <div class="auth-switch">
        Already have an account? <a onclick="showLogin()">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
function showLogin() {
  document.getElementById('login-panel').classList.remove('hidden');
  document.getElementById('register-panel').classList.add('hidden');
}

function showRegister() {
  document.getElementById('login-panel').classList.add('hidden');
  document.getElementById('register-panel').classList.remove('hidden');
}

function showError(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideError(id) {
  document.getElementById(id).classList.add('hidden');
}

document.getElementById('login-btn').addEventListener('click', async function() {
  hideError('login-error');
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;

  if (!email || !password) { showError('login-error', 'Please enter your email and password.'); return; }

  this.disabled = true;
  this.textContent = 'Signing in...';

  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email, password: password})
    });
    var data = await res.json();
    if (data.error) { showError('login-error', data.error); this.disabled = false; this.textContent = 'Sign in'; return; }
    window.location.href = '/app.html';
  } catch(e) {
    showError('login-error', 'Connection error. Please try again.');
    this.disabled = false;
    this.textContent = 'Sign in';
  }
});

document.getElementById('register-btn').addEventListener('click', async function() {
  hideError('register-error');
  var name = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var password = document.getElementById('reg-password').value;

  if (!name || !email || !password) { showError('register-error', 'All fields are required.'); return; }
  if (password.length < 8) { showError('register-error', 'Password must be at least 8 characters.'); return; }

  this.disabled = true;
  this.textContent = 'Creating account...';

  try {
    var res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name: name, email: email, password: password})
    });
    var data = await res.json();
    if (data.error) { showError('register-error', data.error); this.disabled = false; this.textContent = 'Create account'; return; }
    window.location.href = '/app.html';
  } catch(e) {
    showError('register-error', 'Connection error. Please try again.');
    this.disabled = false;
    this.textContent = 'Create account';
  }
});

// Allow enter key on forms
document.getElementById('login-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
document.getElementById('reg-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('register-btn').click();
});

// Check if already logged in
fetch('/api/auth/me').then(function(r) { return r.json(); }).then(function(data) {
  if (data.authenticated) window.location.href = '/app.html';
});
</script>
</body>
</html>
