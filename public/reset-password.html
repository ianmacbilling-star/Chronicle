<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Campaignia</title>
  <link rel="icon" type="image/png" href="/images/Campaignia_Favicon.png" />
<link rel="stylesheet" href="/css/style.css">
<script>/* v3.4.69 -- the page's brand (services/brands.js). The server names it in the cmp_brand cookie, and never for Campaignia; any other brand's theme sheet is laid over Campaignia's here, before the first paint, and the toolbar takes its page color. */(function(){var m=document.cookie.match(/(?:^|;\s*)cmp_brand=([a-z0-9-]+)/);if(!m||m[1]==='campaignia')return;document.write('<link rel="stylesheet" href="/css/themes/'+m[1]+'.css">');document.documentElement.setAttribute('data-brand',m[1]);document.addEventListener('DOMContentLoaded',function(){var t=document.querySelector('meta[name="theme-color"]'),c=getComputedStyle(document.documentElement).getPropertyValue('--page-bg').trim();if(t&&c)t.setAttribute('content',c);});})();</script>
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 400px; background: rgba(var(--panel-rgb),0.92); border: 1px solid rgba(var(--accent-rgb),0.2); border-radius: 16px; padding: 40px; }
    .auth-title { font-family: var(--font-display); font-size: 22px; color: var(--accent-bright); text-align: center; margin-bottom: 6px; }
    .auth-subtitle { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
    .auth-divider { height: 1px; background: rgba(var(--accent-rgb),0.15); margin: 16px 0; }
    .alert-error { background: var(--error-bg); color: var(--error); border: 1px solid rgba(var(--error-rgb),0.3); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
    .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(var(--success-rgb),0.3); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
    .hidden { display: none; }
    .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: rgba(var(--accent-rgb),0.5); cursor: pointer; }
    .back-link a { color: var(--accent-bright); text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="/images/Campaignia_Logo.png" alt="Campaignia" style="height:40px;" />
      </div>
      <div class="auth-title">Choose a New Password</div>
      <div class="auth-subtitle">Enter your new password below</div>
      <div class="auth-divider"></div>

      <div id="error-msg" class="alert-error hidden"></div>
      <div id="success-msg" class="alert-success hidden"></div>

      <div id="reset-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-input" type="password" id="confirm-password" placeholder="Repeat your password" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" id="reset-btn" style="width:100%;">Set New Password</button>
      </div>

      <div class="back-link"><a href="/">Back to sign in</a></div>
    </div>
  </div>

  <script>
    // Get token from URL
    var token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('reset-form').style.display = 'none';
      var err = document.getElementById('error-msg');
      err.textContent = 'Invalid or missing reset token. Please request a new password reset link.';
      err.classList.remove('hidden');
    }

    document.getElementById('reset-btn').addEventListener('click', async function() {
      var password = document.getElementById('new-password').value;
      var confirm = document.getElementById('confirm-password').value;
      var errorEl = document.getElementById('error-msg');
      var successEl = document.getElementById('success-msg');

      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      if (!password || password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        errorEl.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      this.disabled = true;
      this.textContent = 'Saving...';

      try {
        var r = await fetch('/api/email/reset-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token: token, password: password })
        });
        var data = await r.json();

        if (data.error) {
          errorEl.textContent = data.error;
          errorEl.classList.remove('hidden');
          this.disabled = false;
          this.textContent = 'Set New Password';
          return;
        }

        document.getElementById('reset-form').style.display = 'none';
        successEl.textContent = 'Password updated successfully! Redirecting you to sign in...';
        successEl.classList.remove('hidden');
        setTimeout(function() { window.location.href = '/'; }, 2500);

      } catch(e) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.remove('hidden');
        this.disabled = false;
        this.textContent = 'Set New Password';
      }
    });

    // Allow enter key
    document.getElementById('confirm-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('reset-btn').click();
    });
  </script>
<script src="/js/pw-eye.js" defer></script>
</body>
</html>
