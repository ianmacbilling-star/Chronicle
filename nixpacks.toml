# ============================================================================
#  NOT IN USE. RAILWAY DOES NOT READ THIS FILE.
#
#  Railway builds with RAILPACK, the successor to Nixpacks -- the build log says
#  `using build driver railpack-v0.35.0`. Build configuration lives in
#  railpack.json in the repo root. Chromium's libraries now arrive as APT
#  packages that Railpack adds automatically when it detects puppeteer, not from
#  the nix store.
#
#  This cost real time on 2026-08-03: ghostscript was added to this file, the
#  deploy succeeded, and nothing installed -- the only symptom being a Lulu
#  transparency warning that would not go away. Everything below, including the
#  advice to hunt for a chromium path and set PUPPETEER_EXECUTABLE_PATH,
#  describes a build system this project no longer uses.
#
#  Kept rather than deleted only in case the builder is ever switched back.
#  DO NOT ADD PACKAGES HERE. Add them to railpack.json.
# ============================================================================

# ============================================================
# nixpacks.toml  -  Railway build config for headless Chromium (Puppeteer)
# ------------------------------------------------------------
# STARTING POINT - expect to tweak this once for your Railway image.
#
# Strategy here: install a SYSTEM Chromium via nix and tell Puppeteer to use it,
# instead of downloading Puppeteer's ~300MB bundled Chromium. The app's renderer
# (services/printing/renderPdf.js) reads PUPPETEER_EXECUTABLE_PATH at runtime, so
# as long as that env var points at a working Chromium binary, rendering works.
#
# After the first deploy, open a Railway shell and run:  which chromium
# Then set PUPPETEER_EXECUTABLE_PATH (Railway dashboard -> Variables) to that path.
# (Leaving it in the dashboard rather than hardcoding here avoids a wrong path
# silently breaking the build.)
#
# ALTERNATIVE (no toml): delete this file and just `npm install puppeteer` so it
# downloads its own Chromium. Simpler, but heavier build and you may still need to
# add a few shared libraries for Chrome to launch. The system-Chromium route below
# is usually the more reliable one on Railway.
# ============================================================

[phases.setup]
# Add system Chromium (pulls in the shared libs Chrome needs) to the build image.
# ghostscript (v3.0.377): flattens transparency in print-bound PDFs. PDF 1.3 has no
# transparency model, so converting to it composites every blend and alpha into the
# page. Lulu warns on transparency; the logos are RGB+ALPHA and most gradients end in
# a transparent stop. If gs is absent the app still works -- flattenPdf.js fails open
# and logs -- so a missing binary shows up as a Lulu warning, not an outage.
nixPkgs = ['nodejs_20', 'chromium', 'ghostscript']

[variables]
# Skip Puppeteer's bundled-Chromium download; use the system Chromium above.
PUPPETEER_SKIP_DOWNLOAD = 'true'
